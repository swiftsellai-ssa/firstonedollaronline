            const [level, setLevel] = useState(1);
            const [showModal, setShowModal] = useState(null);
            const [showLetter, setShowLetter] = useState(null);
            const [history, setHistory] = useState({});
            const [timeTracking, setTimeTracking] = useState({});
            const [badges, setBadges] = useState([]);
            const [startDate, setStartDate] = useState(null);
            const [showProofUpload, setShowProofUpload] = useState(false);
            const [proofUploaded, setProofUploaded] = useState(false);
            const [streak, setStreak] = useState(0);

            // Real-time Visitor Counter
            const [visitorCount, setVisitorCount] = useState("...");

            useEffect(() => {
                // Initialize LocalStorage Data
                const saved = localStorage.getItem('firstDollarJourney');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    setLevel(parsed.level || 1);
                    setHistory(parsed.history || {});
                    setTimeTracking(parsed.timeTracking || {});
                    setBadges(parsed.badges || []);
                    setStartDate(parsed.startDate || null);
                    setProofUploaded(parsed.proofUploaded || false);
                    calculateStreak(parsed.history || {});
                }

                // Fetch Real-time Count
                fetch(COUNT_API_URL)
                    .then(res => res.json())
                    .then(data => {
                        setVisitorCount(data.value);
                    })
                    .catch(err => {
                        console.error("Counter API Error:", err);
                        setVisitorCount("47+"); // Fallback to safe estimate
                    });
            }, []);

            const calculateStreak = (hist) => {
                const dates = Object.values(hist).map(d => new Date(d).toDateString());
                const uniqueDates = [...new Set(dates)].sort((a, b) => new Date(b) - new Date(a));

                let currentStreak = 0;
                const today = new Date().toDateString();

                if (uniqueDates[0] === today || uniqueDates[0] === new Date(Date.now() - 86400000).toDateString()) {
                    for (let i = 0; i < uniqueDates.length; i++) {
                        const expectedDate = new Date(Date.now() - (i * 86400000)).toDateString();
                        if (uniqueDates[i] === expectedDate) {
                            currentStreak++;
                        } else {
                            break;
                        }
                    }
                }

                setStreak(currentStreak);
            };

            const saveProgress = (newLevel, newHistory, newTimeTracking = timeTracking, newBadges = badges, newStartDate = startDate, newProofUploaded = proofUploaded) => {

                    level: newLevel,
                    history: newHistory,
                    timeTracking: newTimeTracking,
                    badges: newBadges,
                    startDate: newStartDate,
                    proofUploaded: newProofUploaded
                };
                localStorage.setItem('firstDollarJourney', JSON.stringify(data));
                setLevel(newLevel);
                setHistory(newHistory);
                setTimeTracking(newTimeTracking);
                setBadges(newBadges);
                setStartDate(newStartDate);
                setProofUploaded(newProofUploaded);
                calculateStreak(newHistory);
            };

            const handleCheckpointClick = (cp) => {
                if (cp.id > level) return;
                setShowModal(cp);
            };

            const awardBadge = (badgeId, newBadges) => {
                if (!newBadges.find(b => b === badgeId)) {
                    return [...newBadges, badgeId];
                }
                return newBadges;
            };

            const handleComplete = (id, timeSpent) => {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                const now = new Date();
                const newHistory = { ...history, [id]: now.toISOString() };
                const newTimeTracking = { ...timeTracking, [id]: timeSpent };
                let newBadges = [...badges];
                let newStartDate = startDate;

                // Set start date on first checkpoint
                if (id === 1 && !startDate) {
                    newStartDate = now.toISOString();
                }

                // Award time-based badges
                const hour = now.getHours();
                if (hour >= 23 || hour < 6) {
                    newBadges = awardBadge('night_owl', newBadges);
                } else if (hour < 7) {
                    newBadges = awardBadge('early_bird', newBadges);
                }

                // Check for speed demon (2 checkpoints same day)
                const today = now.toDateString();
                const completedToday = Object.values(newHistory).filter(d =>
                    new Date(d).toDateString() === today
                ).length;
                if (completedToday >= 2) {
                    newBadges = awardBadge('speed_demon', newBadges);
                }

                // Persistent badge (3 days in a row)
                const uniqueDates = [...new Set(Object.values(newHistory).map(d => new Date(d).toDateString()))];
                if (uniqueDates.length >= 3) {
                    newBadges = awardBadge('persistent', newBadges);
                }

                const newLevel = id === level ? level + 1 : level;
                saveProgress(newLevel, newHistory, newTimeTracking, newBadges, newStartDate, proofUploaded);
                setShowModal(null);

                // Show letter if exists for this checkpoint
                if (CHECKPOINT_LETTERS[id]) {
                    setTimeout(() => setShowLetter(CHECKPOINT_LETTERS[id]), 500);
                }

                // Show proof upload for checkpoint 7
                if (id === 7) {
                    setTimeout(() => setShowProofUpload(true), 1000);
                }
            };

                let newBadges = awardBadge('proof_machine', badges);
                saveProgress(level, history, timeTracking, newBadges, startDate, true);
                setShowProofUpload(false);
            };

                if (confirm("Start over? This will erase all progress.")) {

                    setLevel(1);
                    setHistory({});
                    setTimeTracking({});
                    setBadges([]);
                    setStartDate(null);
                    setProofUploaded(false);
                    setStreak(0);
                }

                if (!startDate) return 0;
                const start = new Date(startDate);
                const now = new Date();
                const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
                return diff;
            };

                return Math.round(((level - 1) / (CHECKPOINTS.length - 1)) * 100);

                            </div>
                            <div className="text-xs text-slate-500">
                                Join the <span className="font-bold text-slate-700">{FOUNDING_STATS.foundingBuilders} Founding Builders</span>. <br />
                                <span className="text-green-600 font-bold">✓ {FOUNDING_STATS.verifiedEarners} Verified First Dollars</span>
                            </div>
                        </div>

                                        <div className="w-full max-w-md">
                                            <div
                                                onClick={() => handleCheckpointClick(cp)}
                                                className={`
                                                    sketchy-box w-full bg-white p-6 cursor-pointer relative
                                                    ${isLocked ? 'locked opacity-60' : 'cursor-pointer hover:bg-slate-50'}
                                                    ${isCurrent ? 'ring-4 ring-blue-200 border-blue-600' : ''}
                                                    ${isCompleted ? 'bg-green-50' : ''}
                                                `}
                                            >
                                                {isCurrent && (
                                                    <div className="absolute -right-4 -top-4 bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full animate-bounce">
                                                        START HERE
                                                    </div>
                                                )}

                                                <div className="flex items-center gap-4 text-left">
                                                    <div className={`
                                                        w-12 h-12 rounded-full border-2 flex items-center justify-center font-bold text-xl shrink-0
                                                        ${isCompleted ? 'bg-green-500 border-green-700 text-white' : 'bg-white border-slate-900'}
                                                        ${isLocked ? 'bg-slate-100 text-slate-400 border-slate-300' : ''}
                                                    `}>
                                                        {isCompleted ? <i className="fas fa-check"></i> : cp.id}
                                                    </div>

                                                    <div className="flex-1">
                                                        <h3 className="font-bold text-lg flex items-center gap-2 flex-wrap">
                                                            {cp.title}
                                                            {isCompleted && (
                                                                <span className="text-xs bg-green-200 text-green-800 px-2 py-0.5 rounded-full font-mono">
                                                                    DONE
                                                                </span>
                                                            )}
                                                        </h3>
                                                        <p className="text-sm text-slate-500 leading-tight mt-1">
                                                            {isLocked ? "Complete previous step to unlock." : cp.desc}
                                                        </p>

                                                    </div>
                                                </div>
                                            </div>

                                            {/* Show completion time if completed */}
                                            {isCompleted && history[cp.id] && (
                                                <div className="mt-2 text-xs text-slate-400 font-mono text-center">
                                                    ✓ Completed {new Date(history[cp.id]).toLocaleDateString()}
                                                    {timeTracking[cp.id] && ` • ${timeTracking[cp.id]}h invested`}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {/* Hall of Legends */}
                        {level > 7 && (
                            <div className="mt-20 p-8 border-4 border-yellow-400 bg-yellow-50 rounded-xl text-center sketchy-box animate-fadeIn">
                                <i className="fas fa-crown text-5xl text-yellow-500 mb-4"></i>
                                <h2 className="text-3xl font-black mb-2">🏛️ HALL OF LEGENDS 🏛️</h2>
                                <p className="text-lg mb-6">You made it. You earned your first dollar on the internet.</p>

                                <div className="bg-white border-2 border-slate-900 p-6 mb-6 text-left">
                                    <h3 className="font-bold mb-3 text-center">YOUR STATS:</h3>
                                    <div className="space-y-2 font-mono text-sm">
                                        <div className="flex justify-between">
                                            <span>Started:</span>
                                            <span className="font-bold">{startDate ? new Date(startDate).toLocaleDateString() : 'N/A'}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Completed:</span>
                                            <span className="font-bold">{history[7] ? new Date(history[7]).toLocaleDateString() : 'Today'}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Total Days:</span>
                                            <span className="font-bold">{days} days</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Time Invested:</span>
                                            <span className="font-bold">{totalTime.toFixed(1)} hours</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Badges Earned:</span>
                                            <span className="font-bold">{badges.length}</span>
                                        </div>
                                    </div>
                                </div>

                                {proofUploaded && (
                                    <div className="bg-green-100 border-2 border-green-500 p-4 mb-4 rounded-lg">
                                        <i className="fas fa-camera text-green-600 text-2xl mb-2"></i>
                                        <p className="font-bold text-green-800">Proof Uploaded! 📸</p>
                                        <p className="text-sm text-green-700">You're officially a legend.</p>
                                    </div>
                                )}

                                <button
                                    onClick={shareToTwitter}
                                    className="w-full bg-blue-500 text-white font-bold py-4 text-lg mb-3 hover:bg-blue-600 transition-colors sketchy-box border-blue-700"
                                >
                                    <i className="fab fa-twitter mr-2"></i>
                                    Share Your Win on Twitter
                                </button>

                                <div className="font-mono bg-white p-4 border-2 border-slate-900 inline-block rotate-1 mb-6">
                                    CERTIFIED INTERNET EARNER
                                </div>

                                <p className="text-sm text-slate-600 mb-4">
                                    This isn't your ceiling. It's your floor.<br />
                                    If you can make $1, you can make $1,000.
                                </p>

                                <div className="mt-6">
                                    <button onClick={handleReset} className="text-slate-400 underline text-sm hover:text-red-500">
                                        Start New Journey
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* CHECKPOINT MODAL */}
                    {showModal && (
                        <CheckpointModal
                            checkpoint={showModal}
                            onComplete={handleComplete}
                            onClose={() => setShowModal(null)}
                            history={history}
                        />
                    )}

                    {/* LETTER MODAL */}
                    {showLetter && (
                        <LetterModal
                            letter={showLetter}
                            onClose={() => setShowLetter(null)}
                        />
                    )}

                    {/* PROOF UPLOAD MODAL */}
                    {showProofUpload && (
                        <ProofUploadModal
                            onUpload={handleProofUpload}
                            onSkip={() => setShowProofUpload(false)}
                        />
                    )}
                </div>
            );
        }

        // Checkpoint Modal Component
        function CheckpointModal({ checkpoint, onComplete, onClose, history }) {
            const [timeSpent, setTimeSpent] = useState('1');
            const [showStruggles, setShowStruggles] = useState(false);
            const struggles = STRUGGLE_LOGS[checkpoint.id] || [];
            const randomStruggle = struggles[Math.floor(Math.random() * struggles.length)];

            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn" onClick={(e) => {
                    if (e.target === e.currentTarget) onClose();
                }}>
                    <div className="bg-white max-w-2xl w-full sketchy-box p-8 relative max-h-[90vh] overflow-y-auto">
                        <button
                            onClick={onClose}
                            className="absolute top-4 right-4 text-slate-400 hover:text-slate-900 text-xl"
                        >
                            <i className="fas fa-times"></i>
                        </button>

                        <div className="text-center mb-6">
                            <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border-2 border-blue-900">
                                <i className={`fas ${checkpoint.icon}`}></i>
                            </div>
                            <h2 className="text-2xl font-black uppercase tracking-wide">{checkpoint.title}</h2>
                            <div className="w-16 h-1 bg-slate-900 mx-auto mt-2"></div>
                        </div>

                        <div className="space-y-6">
                            {/* Reality Check Quote */}
                            <div className="bg-slate-50 p-4 border-l-4 border-slate-900">
                                <p className="font-mono text-sm text-slate-500 mb-1">REALITY CHECK:</p>
                                <p className="italic font-medium text-slate-800">"{checkpoint.quote}"</p>
                            </div>

                            {/* Mission */}
                            <div>
                                <h3 className="font-bold text-lg mb-2">YOUR MISSION:</h3>
                                <p className="text-slate-700 leading-relaxed text-lg">
                                    {checkpoint.task}
                                </p>
                            </div>

                            {/* Expected Time */}
                            <div className="bg-blue-50 p-4 rounded-lg border-2 border-blue-200">
                                <div className="grid grid-cols-2 gap-4 text-center">
                                    <div>
                                        <div className="text-xs text-blue-600 mb-1">⏰ TYPICAL TIME</div>
                                        <div className="font-bold">{checkpoint.avgTime}</div>
                                    </div>
                                    <div>
                                        <div className="text-xs text-blue-600 mb-1">📊 COMMUNITY AVG</div>
                                        <div className="font-bold">{checkpoint.communityAvg}</div>
                                    </div>
                                </div>
                            </div>

                            {/* The Reality Compass */}
                            <div className="bg-red-50 border-2 border-red-200 p-4 rounded-lg">
                                <h4 className="font-bold text-red-800 mb-2 flex items-center gap-2">
                                    <i className="fas fa-compass"></i>
                                    THE REALITY COMPASS
                                </h4>
                                <div className="space-y-3 text-sm">
                                    <div>
                                        <div className="font-bold text-red-700">⚠️ WHAT MOST PEOPLE DO WRONG:</div>
                                        <div className="text-slate-700">{checkpoint.wrongMoves}</div>
                                    </div>
                                    <div>
                                        <div className="font-bold text-red-700">💡 THE UNCOMFORTABLE TRUTH:</div>
                                        <div className="text-slate-700">{checkpoint.truth}</div>
                                    </div>
                                    <div>
                                        <div className="font-bold text-red-700">🎯 HOW TO PUSH THROUGH:</div>
                                        <div className="text-slate-700">{checkpoint.pushThrough}</div>
                                    </div>
                                </div>
                            </div>

                            {/* Struggle Log */}
                            {struggles.length > 0 && (
                                <div>
                                    <button
                                        onClick={() => setShowStruggles(!showStruggles)}
                                        className="w-full text-left bg-purple-50 border-2 border-purple-200 p-4 rounded-lg hover:bg-purple-100 transition-colors"
                                    >
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-2">
                                                <i className="fas fa-comments text-purple-600"></i>
                                                <span className="font-bold text-purple-800">REAL STRUGGLES FROM OTHERS</span>
                                            </div>
                                            <i className={`fas fa-chevron-${showStruggles ? 'up' : 'down'} text-purple-600`}></i>
                                        </div>
                                    </button>
                                    {showStruggles && (
                                        <div className="mt-2 space-y-2 animate-slideUp">
                                            {struggles.map((struggle, idx) => (
                                                <div key={idx} className="bg-white border-l-4 border-purple-400 p-3 text-sm italic text-slate-700">
                                                    "{struggle}"
                                                    <div className="text-xs text-slate-400 mt-1">- Anonymous builder</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    {!showStruggles && randomStruggle && (
                                        <div className="mt-2 bg-white border-l-4 border-purple-400 p-3 text-sm italic text-slate-700 animate-slideUp">
                                            "{randomStruggle}"
                                            <div className="text-xs text-slate-400 mt-1">- Anonymous builder</div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Time Tracking */}
                            <div>
                                <label className="block font-bold text-sm mb-2">
                                    How long did this take you?
                                </label>
                                <div className="flex gap-2">
                                    {['0.5', '1', '2', '4'].map(time => (
                                        <button
                                            key={time}
                                            onClick={() => setTimeSpent(time)}
                                            className={`flex-1 py-2 rounded border-2 font-bold transition-colors ${timeSpent === time
                                                    ? 'bg-blue-500 text-white border-blue-700'
                                                    : 'bg-white border-slate-300 hover:border-blue-400'
                                                }`}
                                        >
                                            {time}h
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Action Button */}
                            <button
                                onClick={() => onComplete(checkpoint.id, timeSpent)}
                                className="w-full bg-slate-900 text-white font-bold py-4 text-lg hover:bg-blue-600 transition-colors sketchy-box border-transparent"
                            >
                                {history[checkpoint.id]
                                    ? <span className="text-green-300"><i className="fas fa-check mr-2"></i> COMPLETED</span>
                                    : <span><i className="fas fa-square mr-2"></i> {checkpoint.action}</span>
                                }
                            </button>

                            {history[checkpoint.id] && (
                                <p className="text-center text-xs text-slate-400 mt-2 font-mono">
                                    Completed on {new Date(history[checkpoint.id]).toLocaleDateString()}
                                </p>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Letter Modal Component
        function LetterModal({ letter, onClose }) {
            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn">
                    <div className="bg-amber-50 max-w-lg w-full border-4 border-amber-900 p-8 relative shadow-2xl" style={{
                        transform: 'rotate(-1deg)',
                        boxShadow: '8px 8px 0px rgba(0,0,0,0.2)'
                    }}>
                        <div className="text-center mb-6">
                            <div className="text-4xl mb-3">✉️</div>
                            <h2 className="text-2xl font-black uppercase tracking-wide">{letter.title}</h2>
                            <div className="w-16 h-1 bg-amber-900 mx-auto mt-2"></div>
                        </div>

                        <div className="bg-white p-6 border-2 border-amber-900 mb-6" style={{ transform: 'rotate(1deg)' }}>
                            <pre className="whitespace-pre-wrap font-sans text-slate-800 leading-relaxed">
                                {letter.message}
                            </pre>
                        </div>

                        <button
                            onClick={onClose}
                            className="w-full bg-amber-900 text-white font-bold py-3 hover:bg-amber-800 transition-colors sketchy-box"
                        >
                            Keep Climbing
                        </button>
                    </div>
                </div>
            );
        }

        // Proof Upload Modal Component
        function ProofUploadModal({ onUpload, onSkip }) {
            const [uploading, setUploading] = useState(false);

            const handleUpload = () => {
                setUploading(true);
                // Simulate upload
                setTimeout(() => {
                    onUpload();
                    confetti({
                        particleCount: 200,
                        spread: 100,
                        origin: { y: 0.6 }
                    });
                }, 1000);
            };

            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fadeIn">
                    <div className="bg-white max-w-lg w-full sketchy-box p-8 relative">
                        <div className="text-center mb-6">
                            <div className="text-5xl mb-3">📸</div>
                            <h2 className="text-2xl font-black mb-2">PROVE IT!</h2>
                            <p className="text-slate-600">
                                Upload a screenshot of your first dollar earned.<br />
                                (Optional but legendary)
                            </p>
                        </div>

                        <div className="bg-gradient-to-br from-green-50 to-emerald-50 border-2 border-green-300 rounded-lg p-8 mb-6 text-center">
                            <i className="fas fa-cloud-upload-alt text-5xl text-green-600 mb-4"></i>
                            <p className="text-sm text-slate-600 mb-4">
                                Drag & drop your screenshot here<br />
                                or click to browse
                            </p>
                            <button
                                onClick={handleUpload}
                                disabled={uploading}
                                className="bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 disabled:bg-slate-400"
                            >
                                {uploading ? 'Uploading...' : 'Upload Screenshot'}
                            </button>
                        </div>

                        <div className="text-xs text-slate-500 mb-4 text-center">
                            Your proof will be added to the Hall of Legends and inspire others to start their journey.
                        </div>

                        <div className="flex gap-3">
                            <button
                                onClick={onSkip}
                                className="flex-1 bg-slate-200 text-slate-700 py-3 rounded-lg font-bold hover:bg-slate-300"
                            >
                                Skip for Now
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
