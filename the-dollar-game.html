<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your First Dollar Path – First$1online</title>
    <meta name="description" content="Discover your personalized path to earning your first dollar online.">

    <!-- CDNs for React, Tailwind, and Icons -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700;900&display=swap');

        :root {
            --primary: #2563eb;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            background: var(--white);
            box-shadow: var(--shadow);
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 900;
            font-size: 1.6rem;
            color: var(--primary);
            text-decoration: none;
        }

        .nav-links a {
            margin-left: 2rem;
            color: #1f2937;
            text-decoration: none;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes confetti {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        .slide-in {
            animation: slideIn 0.4s ease-out;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            animation: confetti 3s ease-out forwards;
            z-index: 1000;
        }

        .progress-bar {
            transition: width 0.5s ease-out;
        }
    </style>
</head>

<body class="bg-slate-50">

    <nav>
        <a href="index.html" class="logo">First$1online</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </nav>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icon Components
        const Sparkles = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
            </svg>
        );

        const TrendingUp = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                <polyline points="16 7 22 7 22 13" />
            </svg>
        );

        const CheckCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
        );

        const Lightbulb = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />
                <path d="M9 18h6" />
                <path d="M10 22h4" />
            </svg>
        );

        const Download = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
        );

        const ArrowRight = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <line x1="5" y1="12" x2="19" y2="12" />
                <polyline points="12 5 19 12 12 19" />
            </svg>
        );

        // Quiz Questions
        const questions = [
            {
                id: 1,
                question: "What's your current situation?",
                icon: "💼",
                options: [
                    { text: "I have 1-2 hours per day", value: "partTime", weight: { freelance: 2, content: 3, digital: 2, consulting: 1 } },
                    { text: "I can dedicate 4+ hours daily", value: "fullTime", weight: { freelance: 3, content: 2, digital: 3, consulting: 2 } },
                    { text: "Just weekends for now", value: "weekends", weight: { freelance: 1, content: 3, digital: 2, consulting: 1 } },
                    { text: "Flexible schedule", value: "flexible", weight: { freelance: 2, content: 2, digital: 2, consulting: 3 } }
                ]
            },
            {
                id: 2,
                question: "What describes you best?",
                icon: "✨",
                options: [
                    { text: "I love creating and sharing content", value: "creator", weight: { content: 5, digital: 2, freelance: 1, consulting: 1 } },
                    { text: "I'm good at solving problems", value: "solver", weight: { freelance: 4, consulting: 4, digital: 2, content: 1 } },
                    { text: "I have specialized knowledge/skills", value: "expert", weight: { consulting: 5, digital: 3, freelance: 2, content: 2 } },
                    { text: "I'm entrepreneurial and love building", value: "builder", weight: { digital: 5, freelance: 2, content: 2, consulting: 2 } }
                ]
            },
            {
                id: 3,
                question: "How do you prefer to work?",
                icon: "🎯",
                options: [
                    { text: "One-on-one with clients", value: "oneOnOne", weight: { freelance: 4, consulting: 5, content: 1, digital: 1 } },
                    { text: "Create once, sell many times", value: "scalable", weight: { digital: 5, content: 4, freelance: 1, consulting: 1 } },
                    { text: "Build an audience over time", value: "audience", weight: { content: 5, digital: 2, freelance: 1, consulting: 2 } },
                    { text: "Mix of different approaches", value: "mixed", weight: { freelance: 2, content: 2, digital: 2, consulting: 2 } }
                ]
            },
            {
                id: 4,
                question: "What's your strongest skill area?",
                icon: "🚀",
                options: [
                    { text: "Writing, design, or creative work", value: "creative", weight: { content: 4, digital: 3, freelance: 3, consulting: 1 } },
                    { text: "Technical skills (coding, data, etc.)", value: "technical", weight: { freelance: 5, consulting: 3, digital: 2, content: 1 } },
                    { text: "Teaching or explaining things", value: "teaching", weight: { content: 4, consulting: 4, digital: 3, freelance: 1 } },
                    { text: "Strategy and business advice", value: "strategy", weight: { consulting: 5, digital: 2, freelance: 2, content: 2 } }
                ]
            },
            {
                id: 5,
                question: "How soon do you want your first dollar?",
                icon: "⏰",
                options: [
                    { text: "Within days (urgent!)", value: "urgent", weight: { freelance: 5, consulting: 3, content: 1, digital: 1 } },
                    { text: "Within 1-2 weeks", value: "soon", weight: { freelance: 4, consulting: 4, content: 2, digital: 2 } },
                    { text: "Within a month", value: "month", weight: { freelance: 3, content: 3, digital: 3, consulting: 3 } },
                    { text: "I'm patient, building for long-term", value: "longTerm", weight: { digital: 4, content: 5, freelance: 2, consulting: 2 } }
                ]
            }
        ];

        // Path Results
        const pathResults = {
            freelance: {
                title: "The Freelance Starter",
                subtitle: "Turn your skills into immediate income",
                emoji: "💻",
                description: "You're ready to sell your services directly to clients. This is the fastest path to your first dollar!",
                timeToFirstDollar: "3-7 days",
                difficulty: "Beginner-friendly",
                platforms: ["Fiverr", "Upwork", "Freelancer.com", "PeoplePerHour"],
                firstSteps: [
                    "Choose ONE specific service you can offer (writing, design, VA work, etc.)",
                    "Create a profile on Fiverr with a clear, simple gig",
                    "Set a competitive starting price ($5-25 for your first gig)",
                    "Apply to 5-10 jobs daily on Upwork"
                ],
                proTip: "Start with a simple service you can deliver in 1-2 hours. Speed and reliability beat perfection when starting out.",
                successStory: "Sarah made $47 in her first week offering basic logo design on Fiverr, even as a beginner."
            },
            content: {
                title: "The Content Creator",
                subtitle: "Build an audience and monetize your passion",
                emoji: "📱",
                description: "You love creating and sharing. Build your audience and multiple income streams will follow.",
                timeToFirstDollar: "2-4 weeks",
                difficulty: "Medium effort, high reward",
                platforms: ["YouTube", "TikTok", "Medium", "Substack", "Instagram"],
                firstSteps: [
                    "Pick ONE platform where your target audience hangs out",
                    "Create 5 pieces of helpful content this week",
                    "Enable monetization (ad revenue, tips, affiliate links)",
                    "Engage with 10 people in your niche daily"
                ],
                proTip: "Consistency beats perfection. Post 3-5x per week for 30 days and you'll start seeing traction.",
                successStory: "Mike earned his first $12 from Medium after publishing 8 articles about his coding journey."
            },
            digital: {
                title: "The Digital Product Builder",
                subtitle: "Create once, earn forever",
                emoji: "📦",
                description: "You're entrepreneurial. Create digital products that generate passive income while you sleep.",
                timeToFirstDollar: "2-6 weeks",
                difficulty: "Higher effort, scalable income",
                platforms: ["Gumroad", "Etsy (digital)", "Teachable", "Notion Templates"],
                firstSteps: [
                    "Identify a specific problem you can solve (templates, guides, etc.)",
                    "Create your first simple digital product this week",
                    "List it on Gumroad with clear benefits",
                    "Share it in relevant online communities (Reddit, Facebook groups)"
                ],
                proTip: "Your first product doesn't need to be perfect. Launch it, get feedback, improve it. Action beats planning.",
                successStory: "Emma made $89 in month one selling a simple budget spreadsheet template on Etsy."
            },
            consulting: {
                title: "The Expert Consultant",
                subtitle: "Get paid for your knowledge and experience",
                emoji: "🎓",
                description: "You have valuable expertise. People will pay premium prices for your insights and guidance.",
                timeToFirstDollar: "1-3 weeks",
                difficulty: "Requires established expertise",
                platforms: ["Clarity.fm", "LinkedIn", "Intro.co", "Your own website"],
                firstSteps: [
                    "Define your exact consulting niche (be specific!)",
                    "Create a LinkedIn profile showcasing your expertise",
                    "Offer a free 15-min consultation to 3 people for testimonials",
                    "Set your hourly rate ($50-200+) and promote it"
                ],
                proTip: "Start with 1-hour strategy calls. They're easier to sell than long-term contracts and build trust fast.",
                successStory: "David earned $150 for a 1-hour marketing consultation he booked through LinkedIn."
            }
        };

        const FirstDollarQuiz = () => {
            const [currentStep, setCurrentStep] = useState('welcome'); // welcome, quiz, results
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [scores, setScores] = useState({ freelance: 0, content: 0, digital: 0, consulting: 0 });
            const [topPath, setTopPath] = useState(null);
            const [showConfetti, setShowConfetti] = useState(false);

            const handleAnswer = (questionId, option) => {
                // Save answer
                setAnswers(prev => ({ ...prev, [questionId]: option }));

                // Update scores
                const newScores = { ...scores };
                Object.keys(option.weight).forEach(path => {
                    newScores[path] += option.weight[path];
                });
                setScores(newScores);

                // Move to next question or results
                if (currentQuestion < questions.length - 1) {
                    setTimeout(() => {
                        setCurrentQuestion(prev => prev + 1);
                    }, 300);
                } else {
                    // Calculate top path
                    const sortedPaths = Object.entries(newScores).sort((a, b) => b[1] - a[1]);
                    setTopPath(sortedPaths[0][0]);

                    setTimeout(() => {
                        setCurrentStep('results');
                        setShowConfetti(true);
                        setTimeout(() => setShowConfetti(false), 3000);
                    }, 500);
                }
            };

            const progress = ((currentQuestion + 1) / questions.length) * 100;

            const createConfetti = () => {
                const colors = ['#10b981', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6'];
                const confettiElements = [];

                for (let i = 0; i < 50; i++) {
                    confettiElements.push(
                        <div
                            key={i}
                            className="confetti"
                            style={{
                                left: `${Math.random() * 100}%`,
                                top: `-${Math.random() * 20}px`,
                                backgroundColor: colors[Math.floor(Math.random() * colors.length)],
                                animationDelay: `${Math.random() * 0.5}s`,
                                animationDuration: `${2 + Math.random() * 2}s`
                            }}
                        />
                    );
                }
                return confettiElements;
            };

            const downloadActionPlan = () => {
                const result = pathResults[topPath];
                const content = `
YOUR PERSONALIZED ACTION PLAN
First Dollar Online - ${result.title}

🎯 YOUR PATH: ${result.title}
${result.subtitle}

⏰ Time to First Dollar: ${result.timeToFirstDollar}
📊 Difficulty: ${result.difficulty}

🚀 YOUR FIRST STEPS:
${result.firstSteps.map((step, i) => `${i + 1}. ${step}`).join('\n')}

💡 PRO TIP:
${result.proTip}

📱 RECOMMENDED PLATFORMS:
${result.platforms.join(', ')}

✨ SUCCESS STORY:
${result.successStory}

---
Ready to start? Take action on step 1 TODAY!
Visit: firstonedollaronline.com
`;

                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'my-first-dollar-action-plan.txt';
                a.click();
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 py-12 px-4">
                    {showConfetti && createConfetti()}

                    <div className="max-w-3xl mx-auto">
                        {/* Welcome Screen */}
                        {currentStep === 'welcome' && (
                            <div className="fade-in bg-white rounded-3xl shadow-2xl p-8 md:p-12 text-center">
                                <div className="text-6xl mb-6">💰</div>
                                <h1 className="text-4xl md:text-5xl font-bold text-gray-900 mb-4">
                                    Find Your First Dollar Path
                                </h1>
                                <p className="text-xl text-gray-600 mb-8">
                                    In just 5 questions, discover your personalized roadmap to earning your first dollar online
                                </p>

                                <div className="grid md:grid-cols-3 gap-6 mb-8">
                                    <div className="bg-gradient-to-br from-green-50 to-emerald-50 p-6 rounded-2xl">
                                        <div className="text-3xl mb-2">⚡</div>
                                        <h3 className="font-bold text-gray-900 mb-1">Quick & Easy</h3>
                                        <p className="text-sm text-gray-600">Takes less than 2 minutes</p>
                                    </div>
                                    <div className="bg-gradient-to-br from-blue-50 to-indigo-50 p-6 rounded-2xl">
                                        <div className="text-3xl mb-2">🎯</div>
                                        <h3 className="font-bold text-gray-900 mb-1">Personalized</h3>
                                        <p className="text-sm text-gray-600">Based on your situation</p>
                                    </div>
                                    <div className="bg-gradient-to-br from-purple-50 to-pink-50 p-6 rounded-2xl">
                                        <div className="text-3xl mb-2">📋</div>
                                        <h3 className="font-bold text-gray-900 mb-1">Actionable</h3>
                                        <p className="text-sm text-gray-600">Step-by-step action plan</p>
                                    </div>
                                </div>

                                <button
                                    onClick={() => setCurrentStep('quiz')}
                                    className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-10 py-4 rounded-full text-xl font-bold hover:from-blue-700 hover:to-indigo-700 transform hover:scale-105 transition-all shadow-lg inline-flex items-center gap-2"
                                >
                                    Start Quiz <ArrowRight className="w-6 h-6" />
                                </button>
                            </div>
                        )}

                        {/* Quiz Screen */}
                        {currentStep === 'quiz' && (
                            <div className="fade-in">
                                {/* Progress Bar */}
                                <div className="bg-white rounded-full h-3 mb-8 overflow-hidden shadow-inner">
                                    <div
                                        className="progress-bar bg-gradient-to-r from-blue-500 to-indigo-600 h-full rounded-full"
                                        style={{ width: `${progress}%` }}
                                    />
                                </div>

                                <div className="bg-white rounded-3xl shadow-2xl p-8 md:p-12">
                                    <div className="text-center mb-8">
                                        <div className="text-6xl mb-4">{questions[currentQuestion].icon}</div>
                                        <div className="text-sm font-semibold text-indigo-600 mb-2">
                                            Question {currentQuestion + 1} of {questions.length}
                                        </div>
                                        <h2 className="text-3xl font-bold text-gray-900">
                                            {questions[currentQuestion].question}
                                        </h2>
                                    </div>

                                    <div className="space-y-4">
                                        {questions[currentQuestion].options.map((option, index) => (
                                            <button
                                                key={index}
                                                onClick={() => handleAnswer(questions[currentQuestion].id, option)}
                                                className="w-full bg-gradient-to-r from-gray-50 to-gray-100 hover:from-blue-50 hover:to-indigo-50 border-2 border-gray-200 hover:border-indigo-400 rounded-2xl p-6 text-left transition-all transform hover:scale-102 hover:shadow-lg slide-in"
                                                style={{ animationDelay: `${index * 0.1}s` }}
                                            >
                                                <div className="text-lg font-semibold text-gray-900">
                                                    {option.text}
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Results Screen */}
                        {currentStep === 'results' && topPath && (
                            <div className="fade-in">
                                <div className="bg-white rounded-3xl shadow-2xl overflow-hidden">
                                    {/* Header */}
                                    <div className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-8 md:p-12 text-center">
                                        <div className="text-7xl mb-4">{pathResults[topPath].emoji}</div>
                                        <h2 className="text-4xl font-bold mb-2">
                                            {pathResults[topPath].title}
                                        </h2>
                                        <p className="text-xl text-blue-100">
                                            {pathResults[topPath].subtitle}
                                        </p>
                                    </div>

                                    {/* Content */}
                                    <div className="p-8 md:p-12">
                                        <p className="text-xl text-gray-700 mb-8 text-center">
                                            {pathResults[topPath].description}
                                        </p>

                                        {/* Quick Stats */}
                                        <div className="grid md:grid-cols-2 gap-6 mb-10">
                                            <div className="bg-green-50 border-2 border-green-200 rounded-2xl p-6 text-center">
                                                <div className="text-green-600 font-semibold mb-1">Time to First Dollar</div>
                                                <div className="text-2xl font-bold text-gray-900">
                                                    {pathResults[topPath].timeToFirstDollar}
                                                </div>
                                            </div>
                                            <div className="bg-blue-50 border-2 border-blue-200 rounded-2xl p-6 text-center">
                                                <div className="text-blue-600 font-semibold mb-1">Difficulty Level</div>
                                                <div className="text-2xl font-bold text-gray-900">
                                                    {pathResults[topPath].difficulty}
                                                </div>
                                            </div>
                                        </div>

                                        {/* First Steps */}
                                        <div className="mb-10">
                                            <h3 className="text-2xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                                                <Lightbulb className="w-7 h-7 text-yellow-500" />
                                                Your First Steps
                                            </h3>
                                            <div className="space-y-4">
                                                {pathResults[topPath].firstSteps.map((step, index) => (
                                                    <div key={index} className="flex gap-4 slide-in" style={{ animationDelay: `${index * 0.1}s` }}>
                                                        <div className="flex-shrink-0 w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-full flex items-center justify-center font-bold">
                                                            {index + 1}
                                                        </div>
                                                        <div className="flex-1 bg-gray-50 rounded-xl p-4">
                                                            <p className="text-gray-800 font-medium">{step}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Pro Tip */}
                                        <div className="bg-gradient-to-r from-yellow-50 to-orange-50 border-2 border-yellow-300 rounded-2xl p-6 mb-10">
                                            <div className="flex items-start gap-3">
                                                <div className="text-3xl">💡</div>
                                                <div>
                                                    <h4 className="font-bold text-gray-900 mb-2">Pro Tip</h4>
                                                    <p className="text-gray-700">{pathResults[topPath].proTip}</p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Platforms */}
                                        <div className="mb-10">
                                            <h3 className="text-xl font-bold text-gray-900 mb-4">Recommended Platforms</h3>
                                            <div className="flex flex-wrap gap-3">
                                                {pathResults[topPath].platforms.map((platform, index) => (
                                                    <span key={index} className="bg-indigo-100 text-indigo-800 px-4 py-2 rounded-full font-semibold">
                                                        {platform}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Success Story */}
                                        <div className="bg-green-50 border-2 border-green-200 rounded-2xl p-6 mb-10">
                                            <div className="flex items-start gap-3">
                                                <div className="text-3xl">✨</div>
                                                <div>
                                                    <h4 className="font-bold text-gray-900 mb-2">Real Success Story</h4>
                                                    <p className="text-gray-700 italic">{pathResults[topPath].successStory}</p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Action Buttons */}
                                        <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                            <button
                                                onClick={downloadActionPlan}
                                                className="bg-gradient-to-r from-green-600 to-emerald-600 text-white px-8 py-4 rounded-full text-lg font-bold hover:from-green-700 hover:to-emerald-700 transform hover:scale-105 transition-all shadow-lg inline-flex items-center justify-center gap-2"
                                            >
                                                <Download className="w-5 h-5" />
                                                Download Action Plan
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setCurrentStep('welcome');
                                                    setCurrentQuestion(0);
                                                    setAnswers({});
                                                    setScores({ freelance: 0, content: 0, digital: 0, consulting: 0 });
                                                }}
